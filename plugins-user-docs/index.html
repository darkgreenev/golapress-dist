<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goLaPress plugin docs</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background: #f4f7fb;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }
    .card {
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      padding: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.15;
    }
    p {
      margin: 0 0 20px;
      color: #4b5563;
    }
    ul {
      margin: 0;
      padding-left: 20px;
      display: grid;
      gap: 10px;
    }
    li {
      padding: 8px 0;
    }
    a {
      color: #0f62fe;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
    .empty {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f8fafc;
      color: #526071;
      border: 1px dashed #d3dbe7;
    }
    .meta {
      margin-top: 18px;
      font-size: 0.92rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>goLaPress plugin docs</h1>
      <p>Public documentation for installed plugins lives here. Each entry links to the plugin-specific docs folder.</p>
      
      <div class="empty">No plugin documentation has been published yet.</div>
      
      <div class="meta">Generated by the goLaPress release tooling.</div>
    </div>
  </main>
</body>
</html>
